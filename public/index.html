<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Chillwith3A – Chọn nhạc cho cả phòng</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎶</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<style>
  main { display: grid; gap: 14px; padding: 14px; margin: 0 auto; max-width: 1900px; grid-template-columns: minmax(0, 1fr); }
  #mid { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .searchbar { display: flex; gap: 8px; }
  .searchbar input { flex: 1; }
  .squota { font-size: 12.5px; color: var(--subtle); margin: 8px 4px 0; min-height: 18px; }
  .squota.out { color: var(--admin); }
  .squota button { margin-left: 6px; padding: 3px 12px; font-size: 12.5px; }
  .online { font-size: 12px; color: var(--subtle); margin-top: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #chatPanel h2 .badge { margin-left: auto; font-weight: 500; color: var(--muted); }
  /* Máy tính bảng / laptop nhỏ: 2 cột, chat nằm dưới hàng chờ */
  @media (min-width: 900px) {
    main { height: calc(100vh - 57px); grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "add mid" "add chat"; }
    #addPanel { grid-area: add; display: flex; flex-direction: column; min-height: 0; }
    #results { flex: 1; min-height: 0; }
    #mid { grid-area: mid; }
    #queuePanel { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    #queue { flex: 1; min-height: 0; }
    #chatPanel { grid-area: chat; }
    .chat .msgs { min-height: 0; }
  }
  /* Màn hình rộng: 3 cột, chat chiếm trọn cột phải */
  @media (min-width: 1280px) {
    main { grid-template-columns: minmax(0, 1.15fr) minmax(0, .95fr) minmax(360px, 1fr);
      grid-template-rows: minmax(0, 1fr); grid-template-areas: "add mid chat"; }
  }
  /* Điện thoại: 1 cột */
  @media (max-width: 899px) {
    #mid { display: contents; }
    #nowPanel { order: -1; }
    #results { max-height: 60vh; } #queue { max-height: 50vh; }
    .chat .msgs { max-height: 55vh; min-height: 260px; }
  }
</style>
</head>
<body>
<header>
  <div class="logo">♪</div>
  <h1>Chillwith3A</h1>
  <div class="marquee hidden" id="marquee" title="Thông báo từ Admin"><span class="mq-icon">📢</span><div class="mq-window"><span class="marquee-track" id="marqueeTrack"></span></div></div>
  <div class="me"><span class="dot" id="conn" title="Kết nối"></span><b id="meName" style="color:var(--text)">?</b>&nbsp;&nbsp;<a href="#" id="rename">Đổi tên</a></div>
</header>

<main>
  <section class="panel" id="addPanel">
    <h2>Thêm bài hát</h2>
    <div class="tabs">
      <button class="active" data-tab="search">Tìm trên YouTube</button>
      <button data-tab="link">Dán link YouTube</button>
    </div>
    <form class="searchbar" id="searchForm">
      <input type="text" id="searchInput" placeholder="Bạn muốn nghe gì?" autocomplete="off" enterkeyhint="search">
      <button class="primary" type="submit">Tìm</button>
    </form>
    <div class="squota" id="squota"></div>
    <form class="searchbar hidden" id="linkForm">
      <input type="text" id="linkInput" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off">
      <button class="primary" type="submit">Thêm</button>
    </form>
    <div class="scroll" id="results" style="margin-top:10px">
      <div class="empty">Tìm một bài rồi bấm <b>Thêm</b> để xếp vào hàng chờ.</div>
    </div>
  </section>

  <div id="mid">
    <section class="panel" id="nowPanel">
      <h2><span class="eq"><i></i><i></i><i></i></span> Đang phát</h2>
      <div id="now"><div class="empty">Chưa có bài nào. Hãy là người đầu tiên!</div></div>
    </section>

    <section class="panel" id="queuePanel">
      <h2>Hàng chờ <span class="badge" id="qCount">0</span></h2>
      <div class="scroll" id="queue"></div>
    </section>
  </div>

  <section class="panel chat" id="chatPanel">
    <h2>Chat chung <span class="badge" id="onlineCount">0 online</span></h2>
    <div class="msgs"></div>
    <div class="typing"></div>
    <form>
      <input type="text" placeholder="Nhắn gì đó..." maxlength="500" autocomplete="off" enterkeyhint="send">
      <button class="primary" type="submit">Gửi</button>
    </form>
    <div class="online" id="online"></div>
  </section>
</main>

<div class="overlay hidden" id="nameModal">
  <form class="panel" id="nameForm">
    <h2>Vào phòng nghe nhạc</h2>
    <p class="muted small" style="margin:0 0 16px">Tên của bạn sẽ hiện cạnh những bài bạn chọn và trong chat.</p>
    <label for="nameInput" style="margin-top:0">Tên của bạn</label>
    <input type="text" id="nameInput" maxlength="24" placeholder="Ví dụ: Minh" autocomplete="off" required>
    <div id="pinWrap" class="hidden">
      <label for="pinInput">Mã phòng</label>
      <input type="text" id="pinInput" maxlength="32" placeholder="Xem trên màn hình của Admin" autocomplete="off" inputmode="numeric">
    </div>
    <div class="err-text" id="nameErr"></div>
    <button class="primary" type="submit" style="width:100%;margin-top:4px">Vào phòng</button>
  </form>
</div>

<script src="/static/common.js"></script>
<script>
  const cid = getClientId();
  let name = localStorage.getItem('jb_name') || '';
  const urlPin = new URLSearchParams(location.search).get('pin');
  if (urlPin) { localStorage.setItem('jb_pin', urlPin); history.replaceState(null, '', location.pathname); }
  let pin = localStorage.getItem('jb_pin') || '';
  let config = { pinRequired: false };
  let myOwner = '';
  let conn = null;
  let current = null;

  const chat = setupChat($('#chatPanel'), () => name, () => ({ pin }), {
    myOwner: () => myOwner,
    isMine: (m) => !!myOwner && m.owner === myOwner,
    onTyping: () => conn && conn.send({ type: 'typing' }),
  });

  // ---- Tên + mã phòng ----
  function askName(err = '') {
    $('#nameInput').value = name;
    $('#pinInput').value = pin;
    $('#pinWrap').classList.toggle('hidden', !config.pinRequired);
    $('#nameErr').textContent = err;
    $('#nameModal').classList.remove('hidden');
    setTimeout(() => (name && config.pinRequired ? $('#pinInput') : $('#nameInput')).focus(), 50);
  }
  $('#nameForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const n = $('#nameInput').value.replace(/\s+/g, ' ').trim().slice(0, 24);
    const p = $('#pinInput').value.trim();
    if (!n) return;
    if (config.pinRequired) {
      try { await api('/api/join', { pin: p }); }
      catch (err) { $('#nameErr').textContent = err.message; return; }
    }
    name = n; pin = p;
    localStorage.setItem('jb_name', name); localStorage.setItem('jb_pin', pin);
    $('#nameModal').classList.add('hidden');
    $('#meName').textContent = name;
    connect();
  });
  $('#rename').addEventListener('click', (e) => { e.preventDefault(); askName(); });

  function handleAuthError(err) {
    if (err.status === 403 && /mã phòng/i.test(err.message)) { askName(err.message); return true; }
    return false;
  }

  // ---- Kết nối thời gian thực ----
  function connect() {
    if (conn) conn.close();
    conn = connectWS(() => ({ name, pin }), {
      state: render,
      chatHistory: chat.reset,
      chat: chat.add,
      typing: chat.typing,
      react: chat.react,
      connect: () => $('#conn').classList.add('on'),
      disconnect: () => $('#conn').classList.remove('on'),
    });
  }

  function render(s) {
    current = s;
    const now = $('#now');
    now.innerHTML = '';
    $('#nowPanel').classList.toggle('paused', !!s.paused || !s.nowPlaying);
    if (s.nowPlaying) {
      const n = s.nowPlaying;
      now.append(el('div', { class: 'now' },
        el('img', { src: n.thumb, alt: '' }),
        el('div', { style: 'min-width:0' },
          el('div', { class: 'title' }, n.title),
          el('div', { class: 'np-sub' }, n.channel, ' • ', fmtDur(n.duration), s.paused ? ' • Tạm dừng' : ''),
          el('div', { class: 'np-by' }, 'Chọn bởi ', el('span', { class: 'badge' + (n.owner === myOwner ? ' me' : '') }, n.addedBy)))));
      applyNowTint($('#nowPanel'), n.thumb);
    } else { now.append(el('div', { class: 'empty' }, 'Chưa có bài nào. Hãy là người đầu tiên!')); applyNowTint($('#nowPanel'), null); }

    const q = $('#queue');
    q.innerHTML = '';
    $('#qCount').textContent = s.queue.length;
    if (!s.queue.length) q.append(el('div', { class: 'empty' }, 'Chưa có bài nào chờ. Tìm một bài để thêm vào.'));
    s.queue.forEach((song, i) => {
      const mine = song.owner === myOwner;
      q.append(songRow(song, {
        num: i + 1, mine,
        actions: mine ? [el('button', { class: 'icon', title: 'Xóa bài của bạn', onclick: () => removeSong(song.id) }, '✕')] : [],
      }));
    });

    drawSearchQuota(s.search);
    drawNotice(s.notice);
    $('#onlineCount').textContent = `${s.online.length} người online`;
    $('#online').textContent = s.online.length ? s.online.join(', ') : '';
    $('#online').title = s.online.join(', ');
    refreshResultButtons();
  }

  async function removeSong(id) {
    try { await api('/api/remove', { id, cid }); toast('Đã xóa khỏi hàng chờ'); }
    catch (e) { toast(e.message, true); }
  }

  // ---- Tab ----
  document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => {
    document.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('active', x === b));
    const isSearch = b.dataset.tab === 'search';
    $('#searchForm').classList.toggle('hidden', !isSearch);
    $('#linkForm').classList.toggle('hidden', isSearch);
    (isSearch ? $('#searchInput') : $('#linkInput')).focus();
    drawSearchQuota(searchInfo);
  }));

  // ---- Lượt tìm kiếm còn lại ----
  let searchInfo = null;
  function drawSearchQuota(si) {
    searchInfo = si || null;
    const box = $('#squota');
    box.innerHTML = '';
    box.classList.remove('out');
    if (!si) return;
    const searchTab = !$('#searchForm').classList.contains('hidden');
    if (si.available) {
      if (si.limit && searchTab) box.textContent = `Còn ${si.left} lượt tìm hôm nay cho cả phòng`;
      $('#searchForm button').textContent = 'Tìm';
    } else {
      box.classList.add('out');
      box.append(`Hết lượt tìm hôm nay (có lại lúc ${fmtTime(si.resetAt)}). Hãy tìm trên YouTube rồi dán link vào đây.`);
      $('#searchForm button').textContent = 'Mở YouTube';
    }
  }
  function openYouTubeSearch(q) {
    window.open('https://www.youtube.com/results?search_query=' + encodeURIComponent(q || ''), '_blank', 'noopener');
    document.querySelector('.tabs button[data-tab="link"]').click();
    toast('Copy link bài hát trên YouTube rồi dán vào ô bên dưới');
  }

  // ---- Tìm kiếm ----
  let lastResults = [];
  $('#searchForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const q = $('#searchInput').value.trim();
    if (searchInfo && !searchInfo.available) return openYouTubeSearch(q);
    if (!q) return;
    $('#searchInput').blur();
    const box = $('#results');
    box.innerHTML = '<div class="empty">Đang tìm...</div>';
    try {
      const { items } = await api('/api/search?' + new URLSearchParams({ q, pin }));
      lastResults = items;
      renderResults();
    } catch (err) {
      if (handleAuthError(err)) return;
      box.innerHTML = ''; box.append(el('div', { class: 'empty' }, err.message,
        err.status === 429 && /hết lượt/i.test(err.message) ? el('div', { style: 'margin-top:12px' }, el('button', { class: 'ghost', onclick: () => openYouTubeSearch(q) }, 'Tìm trên YouTube')) : null));
    }
  });

  function inList(videoId) {
    return current && (current.nowPlaying?.videoId === videoId || current.queue.some((s) => s.videoId === videoId));
  }
  function renderResults() {
    const box = $('#results');
    box.innerHTML = '';
    if (!lastResults.length) return box.append(el('div', { class: 'empty' }, 'Không có kết quả.'));
    for (const v of lastResults) {
      const btn = el('button', { class: 'ghost', 'data-vid': v.videoId, onclick: () => addSong({ videoId: v.videoId }, btn) });
      box.append(songRow(v, { actions: [btn] }));
    }
    refreshResultButtons();
  }
  function refreshResultButtons() {
    document.querySelectorAll('#results button[data-vid]').forEach((b) => {
      if (b.dataset.busy) return;
      const added = inList(b.dataset.vid);
      b.disabled = added;
      b.className = added ? 'added' : 'ghost';
      b.textContent = added ? '✓ Đã có' : 'Thêm';
    });
  }

  // ---- Thêm bằng link ----
  $('#linkForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const url = $('#linkInput').value.trim();
    if (!url) return;
    const btn = $('#linkForm button');
    btn.disabled = true;
    if (await addSong({ url })) $('#linkInput').value = '';
    btn.disabled = false;
  });

  async function addSong(payload, btn) {
    if (!name) { askName(); return false; }
    if (btn) { btn.dataset.busy = '1'; btn.disabled = true; btn.textContent = '...'; }
    try {
      const { song } = await api('/api/add', { ...payload, name, cid, pin });
      toast('✅ Đã thêm: ' + song.title);
      return true;
    } catch (err) {
      if (!handleAuthError(err)) toast(err.message, true);
      return false;
    } finally {
      if (btn) { delete btn.dataset.busy; refreshResultButtons(); }
    }
  }

  // ---- Bắt đầu ----
  (async () => {
    myOwner = await ownerHash(cid);
    try { config = await api('/api/config'); } catch (e) {}
    if (!name || (config.pinRequired && !pin)) return askName();
    if (config.pinRequired) {
      try { await api('/api/join', { pin }); } catch (err) { return askName(err.message); }
    }
    $('#meName').textContent = name;
    connect();
  })();
</script>
</body>
</html>
